type: theme-seed

# The starting content coolms-default ships.
#
# ⚠️ THERE IS NO `path: /` HERE, AND THAT IS THE POINT.
#
# The platform draws the first-run panel (this theme's look for it is
# `content/first-run.html.dtmpl`) while the section has no index page, so it
# disappears the moment somebody creates the front page -- nothing to find,
# nothing to switch off, no setting to discover (decided 2026-10-20).
# Seeding a body at `/` would switch the panel off permanently and replace a
# self-removing placeholder with one an editor has to know to delete. The panel
# answers "did it work, and where do I go next", and it has to be there on the
# first visit or it answers nothing.
#
# ⚠️ `privacy` IS seeded, and the difference is not inconsistency. The `{else}`
# device only works where a Node exists WITHOUT a body -- the front page has one
# because `/content/{site}` is the section root. Nothing minted a Node for
# `/privacy`, so its `{else}` stub could never render at all: `/privacy` was a
# 404 while the cookie notice and the footer both linked to it. A stub that
# cannot render is not a self-replacing placeholder, it is dead template. So the
# page is seeded with the same honest text, and the template's `{else}` stays as
# the fallback for a site whose privacy page has been deleted.
#
# ⚠️ Bodies are HTML with no `{` in them. A stored page body is pre-rendered
# through the template engine before it reaches the outer template -- that is
# what lets an editor put a widget in a page -- so a stray brace is a lexer
# token, not a character. A body that needs one writes `&#123;`.
pages:
  - path: about
    locale: en
    title: About
    order: 10
    body: pages/about.html

  - path: contact
    locale: en
    title: Contact
    order: 20
    body: pages/contact.html

  # The policy is the page's CONTENT (decided 2026-10-20): `body` is the
  # placeholder the operator replaces, drawn like any other page. No template
  # here or on the menu entry; noindex while it holds the placeholder -- the
  # operator clears it under the page's SEO fields when their policy is in.
  - path: privacy
    locale: en
    title: Privacy
    order: 90
    body: pages/privacy.html
    noindex: true

  # ⚠️ THE SIGN-IN PAGES ARE CONTENT (decided 2026-10-20): ordinary landing pages, one `auth_form` block each;
  # the form (action, field names, password field, CSRF token) is Identity's and no block field reaches it.
  # `system: true` -- owned by the admin system user, undeletable, changed through elevation, noindex.
  - path: login
    locale: en
    title: Sign in
    order: 101
    body: pages/auth.html
    contentType: landing
    system: true
    blocks:
      - type: auth_form
        form: login
        heading: Sign in

  - path: register
    locale: en
    title: Register
    order: 102
    body: pages/auth.html
    contentType: landing
    system: true
    blocks:
      - type: auth_form
        form: register
        heading: Create account

  - path: forgot-password
    locale: en
    title: Forgot password
    order: 103
    body: pages/auth.html
    contentType: landing
    system: true
    blocks:
      - type: auth_form
        form: password_reset_request
        heading: Forgot password

  - path: forgot-password/confirm
    locale: en
    title: Reset password
    order: 104
    body: pages/auth.html
    contentType: landing
    system: true
    blocks:
      - type: auth_form
        form: password_reset_confirm
        heading: Reset your password

  - path: verify-email
    locale: en
    title: Confirm your address
    order: 105
    body: pages/auth.html
    contentType: landing
    system: true
    blocks:
      - type: auth_form
        form: verify_email
        heading: Confirm your address
        intro: >-
          We sent a code to the address you registered with. Enter it here to confirm the address. Until it is confirmed it cannot be used to sign in or to recover the account.

  - path: invitation
    locale: en
    title: Accept invitation
    order: 106
    body: pages/auth.html
    contentType: landing
    system: true
    blocks:
      - type: auth_form
        form: invitation_accept
        heading: You are invited
        intro: >-
          An account has been prepared for you. Choose a password to take it.
